# Teensy 4.1 quantized LLM firmware.

CONFIG_MAIN_STACK_SIZE=8192

# ── Console: USB CDC-ACM over the Teensy micro-USB ─────────────────────────
# Same path the board uses for flashing (HalfKay), different USB device once
# Zephyr is up. The 4.x USBD "next" stack is required — the legacy device
# stack is broken on the i.MX RT1062.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ── Shell ──────────────────────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_PROMPT_UART="tinyllm> "
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n

# ── Logging ────────────────────────────────────────────────────────────────
# Deferred, not immediate: immediate mode would block the logging caller on
# USB host backpressure, and a stalled log inside the decode loop turns a
# 600 ms token into an unbounded one.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Floating point ─────────────────────────────────────────────────────────
# Activations are fp32 and the Cortex-M7 has a real FPU. FPU_SHARING is on
# because the shell thread and the inference run in different threads and both
# touch floats.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── microSD (usdhc1, 4-bit SDIO) — where models live ───────────────────────
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
# The v4.0 usdhc driver ADMA2-DMAs into caller buffers with no cache
# maintenance, so with the D-cache on, SD reads can serve stale lines — the
# first real model copy corrupted in transit and hung the parser on garbage
# tensor offsets. CPU-driven transfers are coherent by construction, and SD
# throughput is nowhere near the token-rate bottleneck.
CONFIG_IMX_USDHC_DMA_SUPPORT=n
CONFIG_SDMMC_STACK=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=128
CONFIG_FS_FATFS_EXFAT=y

# ── Heap / stacks ──────────────────────────────────────────────────────────
# The engine never allocates; this is for the SD and USB stacks only.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── Faults ─────────────────────────────────────────────────────────────────
# A BusFault on first PSRAM touch is the classic symptom of a bad solder joint.
# EXTRA_EXCEPTION_INFO dumps the full fault registers, making that a
# five-second diagnosis instead of a silent hang. (EXCEPTION_STACK_TRACE
# needs ARCH_STACKWALK, which Cortex-M lacks on Zephyr v4.0.0.)
CONFIG_EXTRA_EXCEPTION_INFO=y
